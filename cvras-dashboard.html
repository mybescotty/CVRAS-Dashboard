<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVRAS Dashboard - First Bus Telematics Report</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --status-0: #d32f2f;
    --status-1: #f57c00;
    --status-2: #fbc02d;
    --status-3: #1976d2;
    --status-4: #388e3c;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #d0d7de;
    --text: #1f2933;
    --muted: #6b7785;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 40px;
  }
  header {
    background: #003087;
    color: #fff;
    padding: 16px 24px;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: .85rem;
    color: var(--muted);
  }
  .upload-zone.dragover {
    border-color: #003087;
    background: #eef3ff;
  }
  .file-meta { font-size: .8rem; color: var(--muted); }

  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 24px;
  }
  .stat-card {
    flex: 1 1 140px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    text-align: center;
  }
  .stat-card .num { font-size: 1.6rem; font-weight: 700; }
  .stat-card .lbl { font-size: .75rem; color: var(--muted); text-transform: uppercase; }
  .stat-card.total .num { color: #003087; }
  .stat-card.s0 .num { color: var(--status-0); }
  .stat-card.s1 .num { color: var(--status-1); }
  .stat-card.s2 .num { color: var(--status-2); }
  .stat-card.s3 .num { color: var(--status-3); }
  .stat-card.s4 .num { color: var(--status-4); }

  #depots { padding: 0 24px; }
  .depot-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .depot-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
    background: #eef1f5;
    cursor: pointer;
  }
  .depot-header h2 { margin: 0; font-size: 1.05rem; }
  .depot-counts {
    font-size: .78rem;
    color: var(--muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .depot-body { padding: 4px 16px 12px; }
  .depot-body.collapsed { display: none; }

  .status-group {
    border-left: 5px solid #ccc;
    margin: 10px 0;
    border-radius: 4px;
    background: #fafbfc;
  }
  .status-group.status-0 { border-left-color: var(--status-0); }
  .status-group.status-1 { border-left-color: var(--status-1); }
  .status-group.status-2 { border-left-color: var(--status-2); }
  .status-group.status-3 { border-left-color: var(--status-3); }
  .status-group.status-4 { border-left-color: var(--status-4); }

  .status-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
  }
  .status-title {
    font-weight: 600;
    font-size: .9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: .75rem;
    font-weight: 700;
    color: #fff;
    margin-left: 6px;
  }
  .badge.status-0 { background: var(--status-0); }
  .badge.status-1 { background: var(--status-1); }
  .badge.status-2 { background: var(--status-2); color: #3a3000; }
  .badge.status-3 { background: var(--status-3); }
  .badge.status-4 { background: var(--status-4); }

  .status-actions { display: flex; gap: 6px; }
  .btn {
    font-size: .75rem;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }
  .btn:hover { background: #f0f3f7; }
  .btn.email { border-color: #003087; color: #003087; }
  .btn.copy { border-color: #555; color: #333; }
  .btn.copy.copied { background: #d4edda; border-color: #28a745; color: #155724; }

  .vehicle-table-wrap { overflow-x: auto; }
  .vehicle-table-wrap.collapsed { display: none; }
  table.vehicle-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .8rem;
    margin: 0 0 8px;
  }
  table.vehicle-table th, table.vehicle-table td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    text-align: left;
    white-space: nowrap;
  }
  table.vehicle-table th { background: #f0f3f7; }
  table.vehicle-table tr:nth-child(even) { background: #fafbfc; }

  .toggle-icon {
    display: inline-block;
    transition: transform .15s;
  }
  .toggle-icon.open { transform: rotate(90deg); }

  .empty-state { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>CVRAS Dashboard</h1>
  <p>First Bus Telematics Report &mdash; Status of Buses on CVRAS Master List, grouped by Depot &amp; Latest Status</p>
</header>

<div class="toolbar">
  <div id="dropZone" class="upload-zone">
    Drop a "First Bus Telematics Report" .xlsx file here, or click to choose a file
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
  </div>
  <div class="file-meta" id="fileMeta"></div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div id="depots"></div>

<div id="emptyState" class="empty-state" style="display:none">
  No data loaded. Upload a CVRAS Telematics Report .xlsx file.
</div>

// Convert an Excel date serial number (1900 date system) to a JS Date.
function excelSerialToDate(serial) {
  const epoch = Date.UTC(1899, 11, 30);
  return new Date(epoch + serial * 86400000);
}

// Decode the compact embedded array-of-arrays into full record objects.
// Each row: [vrm, fleetNo, operator, depot, retrofit, caz, statusCode, removalSerialOrNull, newFailure]
function decodeEmbedded(arr) {
  return arr.map(r => ({
    vrm: r[0],
    fleetNo: r[1],
    operator: r[2],
    depot: r[3] || "(No Depot Assigned)",
    retrofit: r[4],
    caz: r[5],
    status: r[6],
    removalDate: r[7] != null ? excelSerialToDate(r[7]) : null,
    newFailure: r[8]
  }));
}

// Locate the "CVRAS List" sheet, find the header row, map columns by name,
// and read data rows until the first row with a blank VRM.
function parseWorkbook(workbook) {
  const sheetName = workbook.SheetNames.find(
    n => n.trim().toLowerCase() === "cvras list"
  );
  if (!sheetName) {
    throw new Error('Could not find a "CVRAS List" sheet in this workbook.');
  }
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });

  let headerRowIdx = -1;
  let headerRow = null;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const row = rows[i];
    if (row.some(cell => String(cell).trim().toLowerCase() === "vrm")) {
      headerRowIdx = i;
      headerRow = row;
      break;
    }
  }
  if (headerRowIdx === -1) {
    throw new Error('Could not find header row (looking for a "VRM" column) in the CVRAS List sheet.');
  }

  const colIndex = {};
  headerRow.forEach((cell, idx) => {
    const key = String(cell).trim();
    if (key) colIndex[key] = idx;
  });

  function findCol(name) {
    if (colIndex[name] !== undefined) return colIndex[name];
    const target = name.trim().toLowerCase();
    for (const k of Object.keys(colIndex)) {
      if (k.trim().toLowerCase() === target) return colIndex[k];
    }
    return undefined;
  }

  const cols = {
    vrm: findCol("VRM"),
    fleetNo: findCol("Fleet No."),
    operator: findCol("Operator"),
    depot: findCol("Depot"),
    retrofit: findCol("Retrofit Supplier"),
    caz: findCol("CAZ Exemption"),
    status: findCol("Latest Status"),
    removalDate: findCol("CVRAS Removal Date"),
    newFailure: findCol("New Failure Status Since Last Report")
  };

  if (cols.vrm === undefined || cols.status === undefined) {
    throw new Error('CVRAS List sheet is missing the expected "VRM" or "Latest Status" columns.');
  }

  const cell = (row, idx) => (idx !== undefined ? row[idx] : "");

  const records = [];
  for (let i = headerRowIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const vrm = String(cell(row, cols.vrm) ?? "").trim();
    if (!vrm) break;

    const statusRaw = String(cell(row, cols.status) ?? "").trim();
    const statusCode = statusRaw.charAt(0);

    let depot = String(cell(row, cols.depot) ?? "").trim();
    if (!depot) depot = "(No Depot Assigned)";

    let removalDate = null;
    const rdVal = cell(row, cols.removalDate);
    if (rdVal instanceof Date) {
      removalDate = rdVal;
    } else if (typeof rdVal === "number" && rdVal > 0) {
      removalDate = excelSerialToDate(rdVal);
    }

    records.push({
      vrm,
      fleetNo: String(cell(row, cols.fleetNo) ?? "").trim(),
      operator: String(cell(row, cols.operator) ?? "").trim(),
      depot,
      retrofit: String(cell(row, cols.retrofit) ?? "").trim(),
      caz: String(cell(row, cols.caz) ?? "").trim(),
      status: statusCode,
      removalDate,
      newFailure: String(cell(row, cols.newFailure) ?? "").trim()
    });
  }
  return records;
}

// Group records into Map<depotName, { total, statuses: { "0":[...], ..., "4":[...], _other:[...] } }>
function groupData(records) {
  const depotMap = new Map();
  for (const rec of records) {
    if (!depotMap.has(rec.depot)) {
      depotMap.set(rec.depot, {
        total: 0,
        statuses: { "0": [], "1": [], "2": [], "3": [], "4": [], "_other": [] }
      });
    }
    const group = depotMap.get(rec.depot);
    group.total++;
    if (group.statuses[rec.status]) {
      group.statuses[rec.status].push(rec);
    } else {
      group.statuses["_other"].push(rec);
    }
  }
  return depotMap;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(d) {
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function renderSummary(records) {
  const counts = { total: records.length, "0": 0, "1": 0, "2": 0, "3": 0, "4": 0 };
  records.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });

  const bar = document.getElementById("statsBar");
  bar.innerHTML = `
    <div class="stat-card total"><div class="num">${counts.total}</div><div class="lbl">Total Vehicles</div></div>
    ${STATUS_ORDER.map(code => `
      <div class="stat-card s${code}">
        <div class="num">${counts[code]}</div>
        <div class="lbl">${escapeHtml(STATUS_CONFIG[code].short)}</div>
      </div>`).join("")}
  `;
}

function renderDepots(depotMap) {
  const container = document.getElementById("depots");
  container.innerHTML = "";

  let depotNames = Array.from(depotMap.keys()).sort((a, b) => a.localeCompare(b));
  const noDepotIdx = depotNames.indexOf("(No Depot Assigned)");
  if (noDepotIdx !== -1) {
    depotNames.splice(noDepotIdx, 1);
    depotNames.push("(No Depot Assigned)");
  }

  document.getElementById("emptyState").style.display = depotNames.length === 0 ? "block" : "none";

  for (const depotName of depotNames) {
    container.appendChild(buildDepotCard(depotName, depotMap.get(depotName)));
  }
}

function buildDepotCard(depotName, group) {
  const renderOrder = [...STATUS_ORDER, "_other"];

  const card = document.createElement("div");
  card.className = "depot-card";

  const header = document.createElement("div");
  header.className = "depot-header";
  header.innerHTML = `
    <h2>${escapeHtml(depotName)}</h2>
    <div class="depot-counts">
      <span><strong>${group.total}</strong> vehicles</span>
      ${renderOrder.filter(c => group.statuses[c].length > 0).map(c =>
        `<span class="badge status-${c === "_other" ? "_other" : c}" style="${c === "_other" ? `background:${STATUS_CONFIG._other.color}` : ""}">${escapeHtml(STATUS_CONFIG[c].short)}: ${group.statuses[c].length}</span>`
      ).join("")}
    </div>
  `;

  const body = document.createElement("div");
  body.className = "depot-body";

  header.addEventListener("click", () => body.classList.toggle("collapsed"));

  for (const code of renderOrder) {
    const vehicles = group.statuses[code];
    if (vehicles.length === 0) continue;
    body.appendChild(buildStatusGroup(depotName, code, vehicles));
  }

  card.appendChild(header);
  card.appendChild(body);
  return card;
}

function buildStatusGroup(depotName, statusCode, vehicles) {
  const cfg = STATUS_CONFIG[statusCode];
  const wrap = document.createElement("div");
  wrap.className = `status-group status-${statusCode === "_other" ? "_other" : statusCode}`;
  if (statusCode === "_other") wrap.style.borderLeftColor = cfg.color;

  const header = document.createElement("div");
  header.className = "status-header";
  header.innerHTML = `
    <span class="status-title">
      <span class="toggle-icon">&#9656;</span>
      ${escapeHtml(cfg.label)}
      <span class="badge status-${statusCode === "_other" ? "_other" : statusCode}" style="${statusCode === "_other" ? `background:${cfg.color}` : ""}">${vehicles.length}</span>
    </span>
    <span class="status-actions">
      <button type="button" class="btn email">Email</button>
      <button type="button" class="btn copy">Copy</button>
    </span>
  `;

  const tableWrap = document.createElement("div");
  tableWrap.className = "vehicle-table-wrap collapsed";
  tableWrap.appendChild(buildVehicleTable(vehicles));

  const toggleIcon = header.querySelector(".toggle-icon");
  const titleSpan = header.querySelector(".status-title");
  titleSpan.addEventListener("click", () => {
    tableWrap.classList.toggle("collapsed");
    toggleIcon.classList.toggle("open");
  });

  header.querySelector(".btn.email").addEventListener("click", (e) => {
    e.stopPropagation();
    openEmail(depotName, statusCode, vehicles);
  });
  header.querySelector(".btn.copy").addEventListener("click", (e) => {
    e.stopPropagation();
    copyEmailBody(depotName, statusCode, vehicles, e.currentTarget);
  });

  wrap.appendChild(header);
  wrap.appendChild(tableWrap);
  return wrap;
}

function buildVehicleTable(vehicles) {
  const table = document.createElement("table");
  table.className = "vehicle-table";

  const showRemoval = vehicles.some(v => v.removalDate);
  const showFailure = vehicles.some(v => v.newFailure);

  const headers = ["VRM", "Fleet No.", "Operator", "Depot", "Retrofit Supplier", "CAZ Exempt"];
  if (showRemoval) headers.push("CVRAS Removal Date");
  if (showFailure) headers.push("New Failure Status");

  const thead = document.createElement("thead");
  thead.innerHTML = `<tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>`;
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (const v of vehicles) {
    const cells = [v.vrm, v.fleetNo || "-", v.operator, v.depot, v.retrofit || "-", v.caz || "-"];
    if (showRemoval) cells.push(v.removalDate ? formatDate(v.removalDate) : "-");
    if (showFailure) cells.push(v.newFailure || "-");
    const tr = document.createElement("tr");
    tr.innerHTML = cells.map(c => `<td>${escapeHtml(String(c))}</td>`).join("");
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function buildEmailContent(depotName, statusCode, vehicles) {
  const cfg = STATUS_CONFIG[statusCode];
  const count = vehicles.length;
  const plural = count === 1 ? "" : "s";
  const dateStr = new Date().toLocaleDateString("en-GB");

  const intros = {
    "0": `URGENT: ${count} vehicle${plural} at ${depotName} have had their CVRAS/CAZ approval REMOVED and are no longer compliant for Clean Air Zone exemption. Please action urgently, as these vehicles may incur CAZ charges if operated in a Clean Air Zone.`,
    "1": `${count} vehicle${plural} at ${depotName} are reporting "No Telematics" status. Telematics data is not being received and this needs investigation to confirm the unit is fitted, working, and reporting correctly.`,
    "2": `${count} vehicle${plural} at ${depotName} currently have no NOx conversion (retrofit) fitted. A retrofit needs to be scheduled for these vehicles to maintain CAZ compliance.`,
    "3": `${count} vehicle${plural} at ${depotName} have a NOx conversion retrofit fitted, but it is reporting low / underperforming NOx conversion. These vehicles need investigation, possibly by the retrofit supplier.`,
    "4": `${count} vehicle${plural} at ${depotName} are currently OK and fully compliant on the CVRAS Master List. This email is for information only - no action is required.`,
    "_other": `${count} vehicle${plural} at ${depotName} have an unrecognised CVRAS status (${cfg.label}) and may need review.`
  };

  const subjects = {
    "0": `URGENT - CVRAS Approval Removed - ${depotName} (${count} vehicle${plural})`,
    "1": `Action Needed - No Telematics Reporting - ${depotName} (${count} vehicle${plural})`,
    "2": `Action Needed - NOx Conversion Required - ${depotName} (${count} vehicle${plural})`,
    "3": `Action Needed - Low NOx Conversion - ${depotName} (${count} vehicle${plural})`,
    "4": `Information - CVRAS OK Status - ${depotName} (${count} vehicle${plural})`,
    "_other": `CVRAS Status Review - ${depotName} (${count} vehicle${plural})`
  };

  const lines = [];
  lines.push(`CVRAS Status Report - ${depotName}`);
  lines.push(`Status: ${cfg.label}`);
  lines.push(`Report Date: ${dateStr}`);
  lines.push("");
  lines.push(intros[statusCode] || intros["_other"]);
  lines.push("");
  lines.push("Vehicles:");
  lines.push("");

  for (const v of vehicles) {
    let line = `- VRM: ${v.vrm} | Fleet No: ${v.fleetNo || "N/A"} | Operator: ${v.operator} | Retrofit: ${v.retrofit || "N/A"}`;
    if (v.removalDate) line += ` | Removal Date: ${formatDate(v.removalDate)}`;
    if (v.newFailure) line += ` | New Failure: ${v.newFailure}`;
    lines.push(line);
  }

  lines.push("");
  lines.push("---");
  lines.push("Generated by CVRAS Dashboard");

  return { subject: subjects[statusCode] || subjects["_other"], body: lines.join("\n") };
}

function openEmail(depotName, statusCode, vehicles) {
  const { subject, body } = buildEmailContent(depotName, statusCode, vehicles);
  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const a = document.createElement("a");
  a.href = mailto;
  a.click();
}

function copyEmailBody(depotName, statusCode, vehicles, btnEl) {
  const { body } = buildEmailContent(depotName, statusCode, vehicles);

  function showCopied() {
    const original = btnEl.textContent;
    btnEl.textContent = "Copied!";
    btnEl.classList.add("copied");
    setTimeout(() => {
      btnEl.textContent = original;
      btnEl.classList.remove("copied");
    }, 1500);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(body).then(showCopied).catch(() => fallbackCopy(body, showCopied));
  } else {
    fallbackCopy(body, showCopied);
  }
}

function fallbackCopy(text, onSuccess) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    onSuccess();
  } catch (e) {
    alert("Could not copy to clipboard.");
  }
  document.body.removeChild(ta);
}

let currentRecords = [];

function renderAll(records) {
  renderSummary(records);
  renderDepots(groupData(records));
}

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: "array", cellDates: true });
      const records = parseWorkbook(workbook);
      currentRecords = records;
      document.getElementById("fileMeta").textContent =
        `Loaded: ${file.name} - ${records.length} vehicle rows`;
      renderAll(currentRecords);
    } catch (err) {
      alert("Failed to parse file: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function init() {
  currentRecords = decodeEmbedded(EMBEDDED_DATA);
  document.getElementById("fileMeta").textContent =
    `Showing embedded sample data - ${currentRecords.length} vehicle rows (First Bus Telematics Report 08/06/2026)`;
  renderAll(currentRecords);

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");

  dropZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });
  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
